<title id="title">Router条件性权衡：七指标的逐条件均值差与原95%区间</title>
<desc id="desc">两条件各150个配对，Router减off。每指标独立横轴，蓝色无混响、棕色有混响。点为均值，线段为冻结原始95%置信区间，虚线为零。所有精确数值见下方文字和配套JSON。非speaker聚类、无多重比较校正、不是新实验，DNSMOS不是人耳MOS。</desc>
